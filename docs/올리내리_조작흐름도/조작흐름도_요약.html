<title>올리내리 조작 흐름 요약</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 40px 32px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 900; margin: 0 0 8px; }
  .sub { font-size: 14px; color: #6b7280; margin: 0 0 28px; line-height: 1.6; }
  .section-label { font-size: 14px; font-weight: 700; margin: 0 0 14px; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 11.5px; color: #9aa1ac; margin-top: 14px; }

  .box-title { font-size: 14.5px; font-weight: 700; fill: #1a1a1a; }
  .box-sub { font-size: 11px; fill: #6b7280; }
  .arrow-line { stroke: #b6bcc6; stroke-width: 1.6; }
  .neutral { fill: #f1f2f4; }
  .check { fill: #ffffff; stroke: #00a650; stroke-width: 1.6; stroke-dasharray: 5 4; }
  .check-title { font-size: 14.5px; font-weight: 700; fill: #00a650; }
  .dead { fill: #f5f5f6; stroke: #d1d5db; stroke-width: 1.4; stroke-dasharray: 4 4; }
  .dead-title { font-size: 13px; font-weight: 700; fill: #9aa1ac; }
  .dead-sub { font-size: 10px; fill: #b6bcc6; }
  .go { fill: #e8f7ee; }
  .go-title { font-size: 14.5px; font-weight: 700; }
  .go-title .up { fill: #e23f44; }
  .go-title .down { fill: #3366cc; }
  .milestone { fill: #fdecec; }
  .final { fill: #eef1f7; }
  .tag { font-size: 10.5px; font-weight: 700; }
  .tag-yes { fill: #9aa1ac; }
  .tag-no { fill: #00a650; }
</style>

<div class="wrap">
  <h1>NH 올리내리 조작 흐름 — 요약</h1>
  <p class="sub">홈에서 시작해 종목을 살펴보고 방향을 예측한 뒤, 결과가 예측 이력·랭킹에 반영되기까지의 전체 흐름이에요.</p>
  <p class="section-label">동작 흐름</p>

  <figure>
    <svg viewBox="0 0 1500 190" role="img" aria-label="홈에서 종목 검색과 리포트 확인을 거쳐 방향 예측 화면에 진입한다. 이미 예측한 종목이면 결과 대기 안내만 보고 끝나고, 아니면 올리 또는 내리를 선택해 제출한다. 제출 완료 후에는 다음 거래일 종가가 자동으로 확정되어 예측 이력과 랭킹에 반영된다.">
      <defs>
        <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <polygon points="0,0 8,4 0,8" fill="#b6bcc6" />
        </marker>
      </defs>

      <!-- 1. 홈 -->
      <rect class="neutral" x="0" y="20" width="205" height="130" rx="12"/>
      <text class="box-title" x="18" y="52">① 홈</text>
      <text class="box-sub" x="18" y="76">서비스 소개, '종목</text>
      <text class="box-sub" x="18" y="92">살펴보기'로 시작</text>

      <line class="arrow-line" x1="205" y1="85" x2="253" y2="85" marker-end="url(#a)"/>

      <!-- 2. 종목 검색·리포트 -->
      <rect class="neutral" x="253" y="20" width="205" height="130" rx="12"/>
      <text class="box-title" x="271" y="52">② 종목 검색·리포트</text>
      <text class="box-sub" x="271" y="76">종목 선택 후 영향요인·</text>
      <text class="box-sub" x="271" y="92">AI 분석·챗봇 확인</text>

      <line class="arrow-line" x1="458" y1="85" x2="506" y2="85" marker-end="url(#a)"/>

      <!-- 3. 방향 예측 화면 (조건 확인) -->
      <rect class="check" x="506" y="20" width="205" height="130" rx="12"/>
      <text class="check-title" x="524" y="52">③ 방향 예측 화면</text>
      <text class="box-sub" x="524" y="76">이미 예측한</text>
      <text class="box-sub" x="524" y="92">종목인가요?</text>

      <line class="arrow-line" x1="711" y1="85" x2="759" y2="85" marker-end="url(#a)"/>

      <!-- 4-YES: 이미 예측함 (dead end) -->
      <rect class="dead" x="759" y="20" width="205" height="60" rx="10"/>
      <text class="tag tag-yes" x="777" y="38">예</text>
      <text class="dead-title" x="777" y="56">이미 예측했어요</text>
      <text class="dead-sub" x="777" y="72">결과 확정 후 재참여</text>

      <!-- 4-NO: 올리/내리 선택 (continues) -->
      <rect class="go" x="759" y="90" width="205" height="60" rx="10"/>
      <text class="tag tag-no" x="777" y="108">아니오</text>
      <text class="go-title" x="777" y="126"><tspan class="up">올리▲</tspan> / <tspan class="down">내리▼</tspan> 선택</text>

      <line class="arrow-line" x1="964" y1="120" x2="1012" y2="120" marker-end="url(#a)"/>
      <line class="arrow-line" x1="1012" y1="120" x2="1012" y2="85" />

      <!-- 5. 제출 완료 -->
      <rect class="milestone" x="1012" y="20" width="205" height="130" rx="12"/>
      <text class="box-title" x="1030" y="52">⑤ 제출 완료</text>
      <text class="box-sub" x="1030" y="76">제출 시점 기준가 ·</text>
      <text class="box-sub" x="1030" y="92">NH포인트 안내</text>

      <line class="arrow-line" x1="1217" y1="85" x2="1265" y2="85" marker-end="url(#a)"/>

      <!-- 6. 자동 판정 반영 -->
      <rect class="final" x="1265" y="20" width="205" height="130" rx="12"/>
      <text class="box-title" x="1283" y="52">⑥ 자동 판정 반영</text>
      <text class="box-sub" x="1283" y="76">익일 종가 확정 후 예측</text>
      <text class="box-sub" x="1283" y="92">이력 · 랭킹에 자동 반영</text>
    </svg>
    <figcaption>③은 조건 확인 단계, ④는 예/아니오에 따른 분기예요 — '예'는 바로 종료되고, '아니오'만 제출로 이어져요.</figcaption>
  </figure>
</div>
